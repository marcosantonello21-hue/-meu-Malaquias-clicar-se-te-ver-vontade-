<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando...</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    transition: background 0.5s;
}

.card {
    width: 90%;
    max-width: 380px;
    padding: 30px 25px;
    border-radius: 25px;
    background: #191919;
    text-align: center;
    transition: opacity 0.6s;
}

.foto {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    box-shadow: 0 0 35px rgba(255,255,255,.5);
    animation: zoomFoto 10s ease-in forwards;
}

@keyframes zoomFoto {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

    80% {
        transform: scale(1.3);
    }

    100% {
        transform: scale(1.5);
    }
}

h1 {
    margin-top: 25px;
}

.contador {
    font-size: 55px;
    font-weight: bold;
    margin-top: 20px;
}

.progress {
    width: 100%;
    height: 10px;
    background: #333;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 25px;
}

.bar {
    height: 100%;
    width: 0%;
    background: white;
    animation: carregar 10s linear forwards;
}

@keyframes carregar {
    from { width: 0%; }
    to { width: 100%; }
}

/* tela preta */
.preto {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="card" id="card">

    <img class="foto" src="file_00000000d348820e9017253e4c4171a7~3.png" alt="Foto">

    <h1>✨ Preparando...</h1>

    <p>Aguarde alguns segundos</p>

    <div class="contador" id="contador">10</div>

    <div class="progress">
        <div class="bar"></div>
    </div>

</div>

<script>

let tempo = 10;

const contador = document.getElementById("contador");
const card = document.getElementById("card");

const intervalo = setInterval(() => {

    tempo--;

    if (tempo >= 0) {
        contador.textContent = tempo;
    }

    // Quando chegar ao zero
    if (tempo <= 0) {

        clearInterval(intervalo);

        // Faz a foto/tela desaparecer
        card.classList.add("preto");

        // Aguarda meio segundo e abre o TikTok
        setTimeout(() => {

            window.location.href =
            "https://www.tiktok.com/@marcosantonello1";

        }, 600);
    }

}, 1000);

</script>

</body>
</html>
