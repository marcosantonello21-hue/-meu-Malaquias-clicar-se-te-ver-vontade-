<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso restrito</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

.card{
    width:90%;
    max-width:390px;
    padding:28px 22px;
    text-align:center;
    border-radius:24px;
    background:#151515;
    box-shadow:0 0 45px rgba(255,255,255,.12);
    transition:opacity .6s, transform .6s;
}

.foto{
    width:155px;
    height:155px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    animation:zoom 10s ease-in forwards;
}

@keyframes zoom{
    0%{transform:scale(1)}
    40%{transform:scale(1.08)}
    70%{transform:scale(1.25)}
    100%{transform:scale(1.5)}
}

h1{
    font-size:24px;
    margin:22px 0 10px;
}

.aviso{
    color:#bbb;
    font-size:14px;
}

.contador{
    font-size:58px;
    font-weight:bold;
    margin:18px 0;
}

.progress{
    height:9px;
    width:100%;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0;
    background:#fff;
    animation:carregar 10s linear forwards;
}

@keyframes carregar{
    from{width:0}
    to{width:100%}
}

.sumir{
    opacity:0;
    transform:scale(1.15);
}
</style>
</head>

<body>

<div class="card" id="card">

    <img class="foto" src="file_00000000d348820e9017253e4c4171a7~3.png" alt="Foto">

    <h1>🔞🔥 Acesso restrito</h1>

    <div class="aviso">
        Área destinada a maiores de 18 anos
    </div>

    <div class="contador" id="contador">10</div>

    <div class="progress">
        <div class="bar"></div>
    </div>

    <p class="aviso">Preparando acesso...</p>

</div>

<script>

let tempo = 10;

const contador = document.getElementById("contador");
const card = document.getElementById("card");

const intervalo = setInterval(() => {

    tempo--;

    if(tempo >= 0){
        contador.textContent = tempo;
    }

    if(tempo <= 0){

        clearInterval(intervalo);

        card.classList.add("sumir");

        setTimeout(() => {

            window.location.href =
            "https://www.tiktok.com/@marcosantonello1";

        },600);
    }

},1000);

</script>

</body>
</html>
