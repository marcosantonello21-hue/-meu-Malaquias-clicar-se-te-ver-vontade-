<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Aguarde...</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.tela {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.foto {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    opacity: 1;
    transition: opacity 1.5s ease;
}

.foto.sumir {
    opacity: 0;
}

.brilho {
    position: absolute;
    width: 60%;
    height: 100%;
    top: 0;
    left: -80%;
    background: linear-gradient(
        100deg,
        transparent,
        rgba(255,255,255,0.35),
        transparent
    );
    transform: skewX(-20deg);
    animation: brilho 3s infinite;
    pointer-events: none;
}

@keyframes brilho {
    0% {
        left: -80%;
    }
    100% {
        left: 130%;
    }
}

.sombra {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.55)
    );
}

.conteudo {
    position: relative;
    z-index: 5;
    text-align: center;
    color: white;
    width: 90%;
}

.frase {
    font-size: 25px;
    font-weight: bold;
    text-shadow: 0 3px 12px #000;
    margin-bottom: 25px;
}

.contador {
    font-size: 75px;
    font-weight: bold;
    text-shadow: 0 0 25px rgba(255,255,255,0.8);
}

.legenda {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}

.barra {
    width: 85%;
    max-width: 400px;
    height: 7px;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    margin: 25px auto 0;
    overflow: hidden;
}

.progresso {
    height: 100%;
    width: 0%;
    background: white;
    border-radius: 20px;
    transition: width 1s linear;
}

.preto {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    z-index: 10;
    transition: opacity 1s ease;
    pointer-events: none;
}

.preto.ativo {
    opacity: 1;
}

.final {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    opacity: 0;
    transition: opacity 1s ease;
}

.final.ativo {
    opacity: 1;
}

.final-texto {
    text-align: center;
    font-size: 18px;
}

.final-texto div {
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="tela">

    <img
        class="foto"
        id="foto"
        src="file_00000000d348820e9017253e4c4171a7~3.png"
        alt="Imagem"
    >

    <div class="brilho"></div>
    <div class="sombra"></div>

    <div class="conteudo" id="conteudo">

        <div class="frase">
            👀 Aguarde só um pouquinho...
        </div>

        <div class="contador" id="contador">
            10
        </div>

        <div class="legenda">
            Preparando...
        </div>

        <div class="barra">
            <div class="progresso" id="progresso"></div>
        </div>

    </div>

    <div class="preto" id="preto"></div>

    <div class="final" id="final">
        <div class="final-texto">
            <div>😉</div>
            Só mais um instante...
        </div>
    </div>

</div>

<script>

let tempo = 10;

const contador = document.getElementById("contador");
const progresso = document.getElementById("progresso");
const foto = document.getElementById("foto");
const preto = document.getElementById("preto");
const finalTela = document.getElementById("final");

const intervalo = setInterval(function() {

    tempo--;

    contador.textContent = tempo;

    let porcentagem = ((10 - tempo) / 10) * 100;
    progresso.style.width = porcentagem + "%";

    if (tempo <= 0) {

        clearInterval(intervalo);

        // Faz a foto desaparecer
        foto.classList.add("sumir");

        // Tela preta
        setTimeout(function() {
            preto.classList.add("ativo");
        }, 800);

        // Mostra mensagem rapidamente
        setTimeout(function() {
            finalTela.classList.add("ativo");
        }, 1500);

        // Abre o perfil
        setTimeout(function() {
            window.location.href =
            "https://www.tiktok.com/@marcosantonello1";
        }, 2200);
    }

}, 1000);

</script>

</body>
</html>
