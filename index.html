<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carregando...</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#080808,#202020,#080808);
    font-family:Arial,sans-serif;
    color:white;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:380px;
    padding:30px 25px;
    border-radius:25px;
    background:rgba(25,25,25,.95);
    text-align:center;
    box-shadow:0 0 40px rgba(255,255,255,.12);
}

.foto{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    box-shadow:0 0 25px rgba(255,255,255,.45);
    animation:brilho 2s infinite;
}

@keyframes brilho{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 20px rgba(255,255,255,.3);
    }

    50%{
        transform:scale(1.05);
        box-shadow:0 0 40px rgba(255,255,255,.7);
    }
}

h1{
    margin-top:25px;
    font-size:26px;
}

p{
    color:#ccc;
}

.progress{
    width:100%;
    height:12px;
    margin-top:25px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:white;
    animation:carregar 10s linear forwards;
}

@keyframes carregar{
    from{
        width:0%;
    }

    to{
        width:100%;
    }
}

#contador{
    font-size:24px;
    font-weight:bold;
    color:white;
}
</style>
</head>

<body>

<div class="card">

    <img class="foto" src="foto.png" alt="Foto">

    <h1>✨ Preparando...</h1>

    <p>Aguarde alguns segundos</p>

    <div class="progress">
        <div class="bar"></div>
    </div>

    <p>
        Carregando...
        <span id="contador">10</span>
    </p>

</div>

<script>

let tempo = 10;

const contador = document.getElementById("contador");

const intervalo = setInterval(() => {

    tempo--;

    if(tempo >= 0){
        contador.textContent = tempo;
    }

    if(tempo <= 0){
        clearInterval(intervalo);
    }

},1000);

setTimeout(() => {

    window.location.href =
    "https://www.tiktok.com/@marcosantonello1";

},10000);

</script>

</body>
</html>
