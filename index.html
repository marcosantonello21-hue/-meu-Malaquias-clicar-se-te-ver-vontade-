<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando...</title>

<style>
body{
margin:0;
background:linear-gradient(135deg,#0f0f0f,#1f1f1f);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.card{
width:340px;
padding:30px;
border-radius:20px;
background:#1b1b1b;
text-align:center;
box-shadow:0 0 30px rgba(255,255,255,.08);
}

img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid #ffffff;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

h2{
margin-top:20px;
}

.progress{
width:100%;
height:12px;
background:#333;
border-radius:20px;
overflow:hidden;
margin:25px 0;
}

.bar{
height:100%;
width:0%;
background:#ffffff;
animation:load 10s linear forwards;
}

@keyframes load{
to{width:100%;}
}

#contador{
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<img src="file_00000000d348820e9017253e4c4171a7~3.png" alt="Foto">

<h2>Preparando...🔞😈🫣</h2>

<p>Aguarde alguns segundos.</p>

<div class="progress">
<div class="bar"></div>
</div>

<p>Redirecionando em <span id="contador">3</span>...</p>

</div>

<script>

let tempo=2;

setInterval(()=>{
tempo--;
if(tempo>=0){
document.getElementById("contador").innerHTML=tempo;
}
},1000);

setTimeout(()=>{
window.location.href="https://www.tiktok.com/@marcosantonello1";
},3000);

</script>

</body>
</html>
